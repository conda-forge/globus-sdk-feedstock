schema_version: 1

context:
  name: globus-sdk
  version: 4.10.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: d89b9a46079859c920b7402025ad25a5cbf5115b03b1f91f4d7f7e083cd310b1

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61.2
  run:
    - python >=${{ python_min }}
    - requests >=2.19.1,<3.0.0
    - certifi >=2026.10.19
    # pyjwt[crypto] needs nothing extra on conda-forge
    - pyjwt >=2.0.0,<3.0.0
    - cryptography >=3.3.1,!=3.4.0
tests:
  - python:
      imports:
        - globus_sdk
        - globus_sdk.authorizers
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Globus SDK for Python
  description: This SDK provides a convenient Pythonic interface to Globus APIs.
  homepage: https://github.com/globus/globus-sdk-python
  repository: https://github.com/globus/globus-sdk-python
  documentation: http://globus-sdk-python.readthedocs.io/

extra:
  recipe-maintainers:
    - xylar
